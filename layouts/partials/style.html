<style>
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --layer: #f4f4f4;
    --layer-hover: #e8e8e8;
    --text: #161616;
    --text-secondary: #525252;
    --text-helper: #6f6f6f;
    --link: #0f62fe;
    --link-hover: #0043ce;
    --border: #e0e0e0;
    --border-strong: #8d8d8d;
    --selected: #e8e8e8;
    --accent: #0f62fe;
    --header-h: 48px;
    --sidenav-w: 256px;
    --toc-w: 224px;
    --content-w: 800px;
    --font: "IBM Plex Sans", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }

  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #161616;
    --layer: #262626;
    --layer-hover: #353535;
    --text: #f4f4f4;
    --text-secondary: #c6c6c6;
    --text-helper: #a8a8a8;
    --link: #78a9ff;
    --link-hover: #a6c8ff;
    --border: #393939;
    --border-strong: #6f6f6f;
    --selected: #353535;
    --accent: #0f62fe;
  }

  *, *::before, *::after { box-sizing: border-box; border-radius: 0; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.75;
    padding-top: var(--header-h);
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  a { color: var(--link); }
  a:hover { color: var(--link-hover); }

  h1, h2, h3, h4, h5, h6 {
    font-family: var(--font);
    color: var(--text);
    line-height: 1.3;
    scroll-margin-top: 64px;
  }

  h1 { font-size: 40px; font-weight: 300; margin: 0 0 16px; }
  h2 { font-size: 28px; font-weight: 400; margin: 40px 0 16px; }
  h3 { font-size: 20px; font-weight: 600; margin: 32px 0 8px; }
  h4, h5, h6 { font-size: 16px; font-weight: 600; margin: 24px 0 8px; }

  p { margin: 0 0 16px; }

  .topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 8000;
    height: var(--header-h);
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }

  .topbar-inner {
    height: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 8px 0 16px;
  }

  .brand {
    flex: 1;
    min-width: 0;
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
    line-height: 1.3;
    text-decoration: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .brand:hover { color: var(--text); text-decoration: none; }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 40px;
    min-width: 40px;
    padding: 0 12px;
    border: 0;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
  }

  .icon-btn:hover { background: var(--layer-hover); }

  .theme-toggle { width: 40px; padding: 0; }
  .theme-toggle svg { display: block; }
  .theme-toggle .icon-sun { display: none; }
  html[data-theme="dark"] .theme-toggle .icon-moon { display: none; }
  html[data-theme="dark"] .theme-toggle .icon-sun { display: block; }

  .shell {
    display: grid;
    grid-template-columns: minmax(0, var(--content-w)) var(--toc-w);
    justify-content: center;
    align-items: start;
    width: min(100%, calc(var(--content-w) + var(--toc-w)));
    margin: 0 auto;
  }

  .shell.no-toc { grid-template-columns: minmax(0, var(--content-w)); width: min(100%, var(--content-w)); }

  .toc {
    position: sticky;
    top: var(--header-h);
    height: calc(100vh - var(--header-h));
    overflow: auto;
    background: var(--bg);
    border-left: 1px solid var(--border);
    padding: 16px 0;
  }

  main { min-width: 0; padding: 32px 32px 64px; }

  .nav-label {
    margin: 16px 16px 8px;
    color: var(--text-helper);
    font-size: 12px;
    font-weight: 600;
    line-height: 1.4;
    letter-spacing: 0.32px;
  }

  .toc a {
    display: block;
    padding: 8px 16px;
    color: var(--text);
    font-size: 14px;
    line-height: 1.4;
    text-decoration: none;
  }

  .toc a:hover {
    background: var(--layer-hover);
    color: var(--text);
    text-decoration: none;
  }

  .toc a {
    color: var(--text-secondary);
    border-left: 1px solid var(--border);
    padding-top: 6px;
    padding-bottom: 6px;
  }

  .toc ul { list-style: none; margin: 0; padding: 0; }
  .toc li ul a { padding-left: 32px; }
  .toc a.is-active {
    color: var(--link);
    border-left: 2px solid var(--accent);
    background: var(--layer);
    font-weight: 600;
  }

  .doc-header { margin-bottom: 24px; }
  .doc-body { font-size: 16px; line-height: 1.75; }
  .doc-body > :first-child { margin-top: 0; }

  .meta {
    margin: 0;
    color: var(--text-helper);
    font-size: 12px;
    line-height: 1.4;
    letter-spacing: 0.32px;
  }

  .section-label {
    margin: 32px 0 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
  }

  .post-list { display: flex; flex-direction: column; gap: 8px; }

  .post-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas:
      "title date"
      "excerpt excerpt";
    gap: 8px 16px;
    align-items: start;
    padding: 16px;
    background: var(--layer);
    color: var(--text);
    text-decoration: none;
  }

  .post-row:hover { background: var(--layer-hover); color: var(--text); text-decoration: none; }

  .post-row h2 {
    grid-area: title;
    margin: 0;
    font-size: 18px;
    font-weight: 600;
    line-height: 1.4;
    text-align: left;
  }

  .post-row time {
    grid-area: date;
    justify-self: end;
    text-align: right;
  }

  .post-row .card-excerpt { grid-area: excerpt; }

  .card-excerpt {
    margin: 0;
    color: var(--text-secondary);
    font-size: 14px;
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 0; padding: 0; list-style: none; }
  .tags li {
    padding: 2px 8px;
    background: var(--layer);
    color: var(--text);
    font-size: 12px;
    line-height: 1.5;
  }

  .doc-body a { color: var(--link); text-decoration: none; }
  .doc-body a:hover { color: var(--link-hover); text-decoration: underline; }
  .text-link { color: var(--link); text-decoration: none; }
  .text-link:hover { text-decoration: underline; }

  hr { border: 0; border-top: 1px solid var(--border); margin: 24px 0; }

  blockquote {
    margin: 16px 0;
    padding: 16px 16px 16px 20px;
    background: var(--layer);
    border-left: 3px solid var(--accent);
    color: var(--text);
    font-style: normal;
  }

  blockquote p:last-child { margin-bottom: 0; }

  table { width: 100%; border-collapse: collapse; margin: 16px 0 24px; }
  th, td { border: 1px solid var(--border); padding: 12px 16px; text-align: left; vertical-align: top; }
  th { background: var(--layer); font-weight: 600; }

  code, pre, .highlight {
    font-family: var(--mono);
    font-size: 14px;
    line-height: 1.5;
  }

  code {
    padding: 0 4px;
    background: var(--layer);
    color: var(--text);
  }

  pre, .highlight {
    margin: 16px 0;
    padding: 16px;
    background: var(--layer);
    border: 1px solid var(--border);
    overflow-x: auto;
  }

  pre code, .highlight code { padding: 0; background: transparent; }

  .highlight pre { margin: 0; padding: 0; border: 0; background: transparent; }

  img { max-width: 100%; height: auto; border: 1px solid var(--border); }

  details { margin: 16px 0; border: 1px solid var(--border); background: var(--bg); }
  summary { padding: 12px 16px; background: var(--layer); font-weight: 600; cursor: pointer; }
  details > :not(summary) { margin-left: 16px; margin-right: 16px; }

  ul, ol { margin: 0 0 16px; padding-left: 24px; }
  li { margin: 4px 0; }

  @media (max-width: 1100px) {
    .shell, .shell.no-toc {
      grid-template-columns: minmax(0, 1fr);
      width: min(100%, var(--content-w));
    }
    .toc {
      position: static;
      height: auto;
      border-left: 0;
      border-bottom: 1px solid var(--border);
      order: -1;
      padding: 8px 16px 16px;
    }
  }

  @media (max-width: 768px) {
    h1 { font-size: 32px; }
    main { padding: 24px 16px 48px; }
    .post-row { gap: 8px 12px; }
  }
</style>
