{{ define "main" }}
<article class="doc">
  <header class="doc-header">
    <h1>{{ .Title }}</h1>
    {{ if eq .Section "blog" }}
    <p class="meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format (default "2006-01-02" .Site.Params.dateFormat) }}</time>
    </p>
    {{ end }}
    {{ with .Params.tags }}
    <ul class="tags">
      {{ range . }}
      <li>{{ . }}</li>
      {{ end }}
    </ul>
    {{ end }}
  </header>
  <div class="doc-body">
    {{ .Content }}
  </div>
</article>
{{ end }}
